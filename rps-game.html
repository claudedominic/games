<title>가위바위보 대결장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gaegu:wght@400;700&display=swap">
<style>
/* ===== 색 토큰: 밝은 테마가 기본 ===== */
:root{
  --paper:#E4EDFF;
  --paper-2:#D3E1FF;
  --panel:#FFFFFF;
  --ink:#171B2C;
  --ink-soft:#5A6180;
  --pow:#FF3B5C;
  --sun:#FFC53D;
  --sky:#2F6BFF;
  --skin:#FFD5A5;
  --sun-soft:#FFF1CC;
  --sky-soft:#DCE7FF;
  --pow-soft:#FFDDE3;
  --dot:rgba(23,27,44,0.15);
  --drop:#171B2C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A2B;
    --paper-2:#1C2338;
    --panel:#252D48;
    --ink:#EEF1FF;
    --ink-soft:#A4ACCC;
    --pow:#FF5C76;
    --sun:#FFD35F;
    --sky:#6E99FF;
    --skin:#DEAB7C;
    --sun-soft:#4A3A15;
    --sky-soft:#1F2C52;
    --pow-soft:#4C1E27;
    --dot:rgba(238,241,255,0.13);
    --drop:#070A12;
  }
}
:root[data-theme="dark"]{
  --paper:#151A2B;
  --paper-2:#1C2338;
  --panel:#252D48;
  --ink:#EEF1FF;
  --ink-soft:#A4ACCC;
  --pow:#FF5C76;
  --sun:#FFD35F;
  --sky:#6E99FF;
  --skin:#DEAB7C;
  --sun-soft:#4A3A15;
  --sky-soft:#1F2C52;
  --pow-soft:#4C1E27;
  --dot:rgba(238,241,255,0.13);
  --drop:#070A12;
}

*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Jua","Malgun Gothic",sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.page{
  max-width:760px;
  margin:0 auto;
  padding:24px 18px 56px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* ===== 만화 패널 공통 ===== */
.ink{
  background:var(--panel);
  border:4px solid var(--ink);
  border-radius:6px;
  box-shadow:7px 7px 0 var(--drop);
}
.pen{ font-family:"Gaegu","Malgun Gothic",cursive; font-weight:700; }
.boom{ font-family:"Black Han Sans","Malgun Gothic",sans-serif; letter-spacing:0.01em; }

/* ===== 머리말 ===== */
.masthead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.masthead h1{
  margin:0;
  font-family:"Black Han Sans","Malgun Gothic",sans-serif;
  font-size:clamp(1.9rem,7vw,2.9rem);
  line-height:1;
  text-wrap:balance;
  color:var(--ink);
  text-shadow:3px 3px 0 var(--sun);
}
.masthead .tag{ font-size:1.05rem; color:var(--ink-soft); margin:0; }
.sound-btn{
  font-family:inherit; font-size:0.95rem; color:var(--ink);
  background:var(--panel); border:3px solid var(--ink); border-radius:999px;
  padding:6px 14px; cursor:pointer; box-shadow:3px 3px 0 var(--drop);
  transition:transform .1s, box-shadow .1s;
}
.sound-btn:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--drop); }
.sound-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--drop); }

/* ===== 점수판 ===== */
.score{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:10px; padding:14px 16px;
}
.side{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.side.right{ align-items:flex-end; text-align:right; }
.side .who{ font-size:1.1rem; line-height:1.2; }
.side .who.me{ color:var(--sky); }
.side .who.cpu{ color:var(--pow); }
.pips{ display:flex; gap:6px; }
.side.right .pips{ flex-direction:row-reverse; }
.pip{
  width:16px; height:16px; border-radius:50%;
  border:3px solid var(--ink); background:transparent;
}
.pip.on{ background:var(--sun); }
.versus{
  font-family:"Black Han Sans","Malgun Gothic",sans-serif;
  font-size:1.4rem; color:var(--ink-soft);
  padding:0 6px;
}
.goal{ text-align:center; margin:0; color:var(--ink-soft); font-size:0.95rem; }

/* ===== 대결 무대 ===== */
.stage{
  position:relative;
  background:
    radial-gradient(var(--dot) 1.6px, transparent 1.7px) 0 0/11px 11px,
    var(--paper-2);
  padding:22px 16px 26px;
  overflow:hidden;
}
.fighters{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end; }
.fighter{ display:flex; flex-direction:column; align-items:center; gap:10px; }
.nameplate{
  font-size:1rem; padding:3px 14px; border-radius:999px;
  border:3px solid var(--ink); background:var(--panel);
}
.fighter.cpu .nameplate{ background:var(--pow-soft); }
.fighter.me .nameplate{ background:var(--sky-soft); }
.hand{ height:150px; display:flex; align-items:flex-end; justify-content:center; }
.hand-inner{ display:block; }
.hand-art{
  display:block; height:145px; width:auto;
  fill:var(--skin); stroke:var(--ink); stroke-width:7;
  stroke-linejoin:round; stroke-linecap:round;
}
.fighter.cpu .hand-art{ transform:rotate(180deg); }
.pick-label{ font-size:1.15rem; color:var(--ink-soft); min-height:1.6em; }

/* 구호에 맞춰 세 번 튀기 */
@keyframes beat{
  0%{ transform:translateY(0) rotate(0deg); }
  38%{ transform:translateY(-24px) rotate(-7deg); }
  100%{ transform:translateY(0) rotate(0deg); }
}
.shaking .hand-inner{ animation:beat .3s ease-in-out 3; }

/* 구호 자막 */
.chant{
  position:absolute; left:0; right:0; top:44%;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; opacity:0;
}
.chant.show{ opacity:1; }
.chant span{
  font-family:"Black Han Sans","Malgun Gothic",sans-serif;
  font-size:clamp(2.4rem,10vw,3.6rem);
  color:var(--panel);
  -webkit-text-stroke:5px var(--ink);
  paint-order:stroke fill;
  animation:pop .28s ease-out;
}
@keyframes pop{ from{ transform:scale(.5) rotate(-8deg); } to{ transform:scale(1) rotate(-3deg); } }

/* 임팩트 폭발 + 결과 */
.impact{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; visibility:hidden;
}
.impact.show{ visibility:visible; animation:burst .34s cubic-bezier(.2,1.5,.4,1); }
@keyframes burst{ from{ transform:scale(.35) rotate(-14deg); } to{ transform:scale(1) rotate(0deg); } }
.impact svg{ width:min(94%,340px); height:auto; display:block; }
.impact .star{ stroke:var(--ink); stroke-width:5; }
.impact .word{
  position:absolute;
  font-family:"Black Han Sans","Malgun Gothic",sans-serif;
  font-size:clamp(2rem,8.5vw,3rem);
  color:var(--ink);
  transform:rotate(-4deg);
  text-align:center;
}
.impact .word small{ display:block; font-family:"Gaegu",cursive; font-weight:700; font-size:1rem; margin-top:2px; }

/* ===== 선택 버튼 ===== */
.controls{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.choice{
  font-family:"Jua","Malgun Gothic",sans-serif;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:14px 6px 12px; cursor:pointer;
  border:4px solid var(--ink); border-radius:8px;
  box-shadow:6px 6px 0 var(--drop);
  color:var(--ink); font-size:1.25rem;
  transition:transform .1s, box-shadow .1s;
}
.choice[data-pick="scissors"]{ background:var(--sun-soft); }
.choice[data-pick="rock"]{ background:var(--sky-soft); }
.choice[data-pick="paper"]{ background:var(--pow-soft); }
.choice .mini{ height:56px; width:auto; fill:var(--skin); stroke:var(--ink); stroke-width:9; stroke-linejoin:round; stroke-linecap:round; }
.choice .key{ font-family:"Gaegu",cursive; font-weight:700; font-size:0.9rem; color:var(--ink-soft); }
.choice:hover:not(:disabled){ transform:translate(-2px,-2px); box-shadow:9px 9px 0 var(--drop); }
.choice:active:not(:disabled){ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--drop); }
.choice:focus-visible{ outline:4px solid var(--sky); outline-offset:3px; }
.choice:disabled{ cursor:default; opacity:.55; }

/* ===== 기록 ===== */
.record{ padding:12px 14px; }
.record h2{ margin:0 0 8px; font-size:1rem; color:var(--ink-soft); font-weight:400; }
.stamps{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; min-height:52px; align-items:center; }
.stamp{
  flex:0 0 auto; display:flex; align-items:center; gap:5px;
  border:3px solid var(--ink); border-radius:6px; padding:4px 8px;
  background:var(--panel); font-family:"Gaegu",cursive; font-weight:700; font-size:1rem;
}
.stamp svg{ height:24px; width:auto; fill:var(--skin); stroke:var(--ink); stroke-width:10; stroke-linejoin:round; }
.stamp .vs{ color:var(--ink-soft); font-size:.8rem; }
.stamp .mk{ font-family:"Black Han Sans",sans-serif; font-size:.95rem; padding-left:2px; }
.stamp.win .mk{ color:var(--sun); }
.stamp.lose .mk{ color:var(--pow); }
.stamp.draw .mk{ color:var(--sky); }
.stamps .empty{ font-family:"Gaegu",cursive; font-weight:700; color:var(--ink-soft); }

/* ===== 규칙 ===== */
.rules{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
.rule{
  display:flex; align-items:center; gap:6px;
  border:3px dashed var(--ink); border-radius:8px; padding:8px 10px;
  font-family:"Gaegu",cursive; font-weight:700; font-size:1.05rem;
}
.rule svg{ height:34px; width:auto; fill:var(--skin); stroke:var(--ink); stroke-width:10; stroke-linejoin:round; flex:0 0 auto; }
.rule .beats{ font-family:"Black Han Sans",sans-serif; font-size:.9rem; color:var(--pow); }

/* ===== 경기 종료 배너 ===== */
.finale{ padding:18px; text-align:center; display:none; }
.finale.show{ display:block; }
.finale p{ margin:0 0 4px; font-family:"Black Han Sans","Malgun Gothic",sans-serif; font-size:clamp(1.5rem,6vw,2.1rem); }
.finale .note{ font-family:"Gaegu",cursive; font-weight:700; font-size:1.05rem; color:var(--ink-soft); margin-bottom:12px; }
.again{
  font-family:"Jua",sans-serif; font-size:1.2rem; color:var(--ink);
  background:var(--sun); border:4px solid var(--ink); border-radius:8px;
  padding:10px 26px; cursor:pointer; box-shadow:6px 6px 0 var(--drop);
  transition:transform .1s, box-shadow .1s;
}
.again:hover{ transform:translate(-2px,-2px); box-shadow:9px 9px 0 var(--drop); }
.again:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--drop); }
.again:focus-visible{ outline:4px solid var(--sky); outline-offset:3px; }

.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

@media (prefers-reduced-motion:reduce){
  .shaking .hand-inner{ animation:none; }
  .impact.show{ animation:none; }
  .chant span{ animation:none; }
  .choice, .again, .sound-btn{ transition:none; }
}
@media (max-width:420px){
  .hand{ height:118px; }
  .hand-art{ height:112px; }
  .choice{ font-size:1.05rem; }
  .choice .mini{ height:44px; }
}
</style>
